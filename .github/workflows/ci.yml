name: CI

# Runs the same checks as `npm run lint && npm run typecheck && npm test && npm run build`
# on every pull request and on every push to main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder values so the build can load the login module. No real secrets are needed:
          # the build never calls Azure, Claude or the email provider.
          BETTER_AUTH_SECRET: ci-build-placeholder-not-a-real-secret-0000
          BETTER_AUTH_URL: http://localhost:3000
